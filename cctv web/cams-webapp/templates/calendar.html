<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NVR Uptime & Downtime heatmap calendar — Cams WebApp" />
  <title>Uptime Calendar — Cams WebApp</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📹</text></svg>" />
  <style>
    /* ═══  Calendar-specific styles  ═══ */

    /* ── Control Panel ── */
    .controls-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr 1.3fr;
      gap: 24px;
      align-items: end;
    }

    .control-group h3 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .range-display {
      background: var(--accent-glow);
      border: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      color: var(--accent-primary-hover);
      font-weight: 600;
      font-size: 0.857rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preset-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preset-btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-medium);
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.857rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .preset-btn:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary-hover);
      background: var(--accent-glow);
    }

    .preset-btn.active {
      background: var(--accent-primary);
      color: white;
      border-color: var(--accent-primary);
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
    }

    .custom-range-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .custom-range-row .field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .custom-range-row .field label {
      font-size: 0.714rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .custom-range-row input[type="date"] {
      padding: 8px 12px;
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.857rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: all var(--transition-fast);
      color-scheme: dark;
    }

    .custom-range-row input[type="date"]:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .arrow-sep {
      color: var(--text-muted);
      font-size: 1.1rem;
      padding-bottom: 8px;
    }

    .btn-load {
      padding: 8px 20px;
      background: linear-gradient(135deg, var(--accent-primary) 0%, #7c3aed 100%);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.857rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
      white-space: nowrap;
    }

    .btn-load:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .legend-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 18px;
    }

    .legend-label {
      font-size: 0.714rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .legend-gradient {
      width: 140px;
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(to right, #22c55e, #eab308, #ef4444);
      border: 1px solid var(--border-subtle);
    }

    .legend-ends {
      display: flex;
      justify-content: space-between;
      width: 140px;
      margin-top: 2px;
    }

    .legend-ends span {
      font-size: 0.643rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .legend-ends .lo {
      color: var(--accent-green);
    }

    .legend-ends .hi {
      color: var(--accent-red);
    }

    /* ── Calendar Grid ── */
    .calendar-scroll {
      overflow: auto;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      box-shadow: var(--shadow-md);
    }

    .calendar-wrapper {
      display: inline-block;
      min-width: 100%;
    }

    .calendar-row {
      display: grid;
    }

    .calendar-row.header {
      background: rgba(255, 255, 255, 0.02);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .cell {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      font-size: 0.786rem;
    }

    .cell.name {
      background: var(--bg-card-solid);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: sticky;
      left: 0;
      z-index: 5;
      box-shadow: 1px 0 0 var(--border-subtle);
      color: var(--text-secondary);
      font-weight: 500;
      transition: background var(--transition-fast), color var(--transition-fast);
    }

    .cell.name.active {
      background: rgba(99, 102, 241, 0.08);
      color: var(--text-primary);
    }

    .calendar-row.header .cell {
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.714rem;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      text-align: center;
      background: var(--bg-card-solid);
    }

    .calendar-row.header .cell.name {
      color: var(--text-muted);
    }

    .calendar-row.header .cell.day.active {
      background: rgba(99, 102, 241, 0.08);
      color: var(--accent-primary-hover);
    }

    .cell.day {
      min-width: 100px;
      cursor: pointer;
      color: var(--text-primary);
      white-space: pre-line;
      position: relative;
      text-align: center;
      transition: all var(--transition-fast);
    }

    .cell.day:hover {
      filter: brightness(1.3);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.25) !important;
    }

    .calendar-row:not(.header) .cell.day {
      /* we fill the background from JS */
    }

    /* ── NVR Name + Uptime ── */
    .nvr-label {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .nvr-label .nvr-name-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
      color: var(--text-primary);
      font-size: 0.786rem;
    }

    .nvr-label .nvr-ip-text {
      font-size: 0.714rem;
      color: var(--text-muted);
      font-family: 'Inter', monospace;
    }

    .uptime-badge {
      display: inline-flex;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 0.679rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-left: auto;
    }

    .uptime-badge.high {
      background: var(--accent-green-soft);
      color: var(--accent-green);
    }

    .uptime-badge.medium {
      background: var(--accent-amber-soft);
      color: var(--accent-amber);
    }

    .uptime-badge.low {
      background: var(--accent-red-soft);
      color: var(--accent-red);
    }

    /* ── Day Cell Content ── */
    .day-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .day-downtime {
      font-size: 0.714rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .day-hours {
      font-size: 0.643rem;
      color: rgba(255, 255, 255, 0.55);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    /* ── Modal ── */
    .calendar-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn var(--transition-medium) ease;
    }

    .calendar-modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-xl);
      padding: 28px;
      width: 90%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
      animation: slideUp var(--transition-slow) ease;
    }

    .calendar-modal h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .calendar-modal .modal-date {
      font-size: 0.857rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .calendar-modal .timeline {
      margin: 0 0 20px 0;
      padding: 0;
      list-style: none;
    }

    .calendar-modal .timeline li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.857rem;
      color: var(--text-secondary);
    }

    .calendar-modal .timeline li:last-child {
      border-bottom: none;
    }

    .calendar-modal .timeline .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-red);
      flex-shrink: 0;
    }

    .calendar-modal .timeline .dur {
      margin-left: auto;
      font-weight: 600;
      color: var(--accent-amber);
      font-size: 0.786rem;
    }

    .calendar-modal .no-downtime {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px;
      border-radius: var(--radius-sm);
      background: var(--accent-green-soft);
      color: var(--accent-green);
      font-weight: 500;
      font-size: 0.857rem;
    }

    .calendar-modal button {
      background: var(--bg-glass);
      color: var(--text-secondary);
      border: 1px solid var(--border-medium);
      padding: 9px 0;
      border-radius: var(--radius-sm);
      cursor: pointer;
      width: 100%;
      font-family: inherit;
      font-size: 0.857rem;
      font-weight: 500;
      transition: all var(--transition-fast);
    }

    .calendar-modal button:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* ── Summary row ── */
    .summary-strip {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .summary-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-size: 0.857rem;
    }

    .summary-chip .chip-val {
      font-weight: 700;
      color: var(--text-primary);
    }

    .summary-chip .chip-label {
      color: var(--text-muted);
      font-size: 0.786rem;
    }

    /* ── Page title ── */
    .page-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .page-title h2 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin: 0;
    }

    .page-title .subtitle {
      font-size: 0.857rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* ── Responsive ── */
    @media (max-width: 1024px) {
      .controls-card {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    @media (max-width: 640px) {
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .custom-range-row {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Cams Dashboard</h1>
    <div class="actions">
      <a href="/">◧ Dashboard</a>
      <a href="/settings">⚙ Settings</a>
    </div>
  </header>

  <main>
    <div class="page-title">
      <h2>📅 Uptime Calendar</h2>
      <span class="subtitle">— NVR uptime & downtime heatmap</span>
    </div>

    <!-- Control Panel -->
    <div class="controls-card">
      <!-- Selected Range -->
      <div class="control-group">
        <h3>📆 Selected Range</h3>
        <div class="range-display">
          <span id="range-text">Loading…</span>
        </div>
      </div>

      <!-- Quick Presets -->
      <div class="control-group">
        <h3>⚡ Quick Presets</h3>
        <div class="preset-bar">
          <button class="preset-btn active" data-days="7">7 Days</button>
          <button class="preset-btn" data-days="14">14 Days</button>
          <button class="preset-btn" data-days="30">30 Days</button>
          <button class="preset-btn" data-days="90">90 Days</button>
        </div>
      </div>

      <!-- Custom Range -->
      <div class="control-group">
        <h3>🎯 Custom Range</h3>
        <div class="custom-range-row">
          <div class="field">
            <label>From</label>
            <input type="date" id="from-date" />
          </div>
          <span class="arrow-sep">→</span>
          <div class="field">
            <label>To</label>
            <input type="date" id="to-date" />
          </div>
          <button id="load-range" class="btn-load">Load</button>
        </div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input type="text" id="nvr-filter" class="search-input" placeholder="Search NVRs…" style="width:260px;" />

      <div class="legend-card">
        <span class="legend-label">Downtime</span>
        <div>
          <div class="legend-gradient"></div>
          <div class="legend-ends">
            <span class="lo">0 %</span>
            <span class="hi">100 %</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Summary -->
    <div class="summary-strip" id="summary-strip">
      <div class="summary-chip">
        <span class="chip-val" id="sum-total">—</span>
        <span class="chip-label">NVRs</span>
      </div>
      <div class="summary-chip">
        <span class="chip-val" id="sum-perfect" style="color:var(--accent-green)">—</span>
        <span class="chip-label">100 % uptime</span>
      </div>
      <div class="summary-chip">
        <span class="chip-val" id="sum-issues" style="color:var(--accent-amber)">—</span>
        <span class="chip-label">Had downtime</span>
      </div>
      <div class="summary-chip">
        <span class="chip-val" id="sum-avg">—</span>
        <span class="chip-label">Avg uptime</span>
      </div>
    </div>

    <!-- Calendar -->
    <div id="calendar-container" class="calendar-scroll">
      <!-- skeleton -->
      <div style="padding:40px;text-align:center;">
        <div class="skeleton" style="height:20px;width:70%;margin:12px auto;"></div>
        <div class="skeleton" style="height:20px;width:85%;margin:12px auto;"></div>
        <div class="skeleton" style="height:20px;width:60%;margin:12px auto;"></div>
      </div>
    </div>
  </main>

  <script>
    /* ───────── Helpers ───────── */
    function fmtDate(d) {
      return d.toISOString().slice(0, 10);
    }
    function toEpoch(d) {
      return Math.floor(d.getTime() / 1000);
    }
    function startOfDay(d) {
      const x = new Date(d);
      x.setHours(0, 0, 0, 0);
      return x;
    }
    function endOfDay(d) {
      const x = new Date(d);
      x.setHours(23, 59, 59, 999);
      return x;
    }
    function defaultRange() {
      const to = new Date();
      const from = new Date();
      from.setDate(from.getDate() - 6);
      return { from, to };
    }

    function setRangeInputs(from, to) {
      document.getElementById('from-date').value = fmtDate(from);
      document.getElementById('to-date').value = fmtDate(to);
      const rangeText = document.getElementById('range-text');
      const opts = { month: 'short', day: 'numeric', year: 'numeric' };
      rangeText.textContent = `${from.toLocaleDateString(undefined, opts)}  →  ${to.toLocaleDateString(undefined, opts)}`;
    }

    function applyPreset(days) {
      const to = new Date();
      const from = new Date();
      from.setDate(from.getDate() - (days - 1));
      return { from, to };
    }

    async function loadNvrs() {
      const res = await fetch('/api/nvrs');
      return await res.json();
    }

    async function loadEvents(from, to) {
      const q = new URLSearchParams({ from: String(toEpoch(from)), to: String(toEpoch(to)) });
      const res = await fetch(`/api/events?${q.toString()}`);
      return await res.json();
    }

    function buildDays(from, to) {
      const days = [];
      const cur = new Date(startOfDay(from));
      const end = endOfDay(to);
      while (cur <= end) {
        days.push(new Date(cur));
        cur.setDate(cur.getDate() + 1);
      }
      return days;
    }

    function computeDailyDowntime(dayStart, dayEnd, offlineIntervals) {
      let total = 0;
      for (const iv of offlineIntervals) {
        const s = new Date(iv.start * 1000);
        const e = new Date((iv.end ?? Math.floor(Date.now() / 1000)) * 1000);
        const overlapStart = new Date(Math.max(s.getTime(), dayStart.getTime()));
        const overlapEnd = new Date(Math.min(e.getTime(), dayEnd.getTime()));
        const durMs = overlapEnd - overlapStart;
        if (durMs > 0) total += durMs;
      }
      const dayMs = dayEnd - dayStart;
      const ratio = dayMs > 0 ? total / dayMs : 0;
      return { millis: total, ratio };
    }

    /* Color for downtime ratio — green → yellow → red */
    function colorForRatio(r) {
      const c = Math.max(0, Math.min(1, r));
      if (c === 0) return 'rgba(34,197,94,0.12)';
      // green→yellow→red
      if (c < 0.5) {
        const t = c * 2;
        const red = Math.round(34 + (234 - 34) * t);
        const green = Math.round(197 + (179 - 197) * t);
        const blue = Math.round(94 + (8 - 94) * t);
        return `rgba(${red},${green},${blue},${0.25 + 0.35 * t})`;
      } else {
        const t = (c - 0.5) * 2;
        const red = Math.round(234 + (239 - 234) * t);
        const green = Math.round(179 + (68 - 179) * t);
        const blue = Math.round(8 + (68 - 8) * t);
        return `rgba(${red},${green},${blue},${0.6 + 0.25 * t})`;
      }
    }

    function uptimeClass(pct) {
      if (pct >= 99.5) return 'high';
      if (pct >= 90) return 'medium';
      return 'low';
    }

    /* ───────── Render Calendar ───────── */
    function renderCalendar(nvrs, events, days) {
      const container = document.getElementById('calendar-container');
      container.innerHTML = '';
      const wrapper = document.createElement('div');
      wrapper.className = 'calendar-wrapper';

      const colDef = `240px repeat(${days.length}, 1fr)`;

      // Header row
      const headerRow = document.createElement('div');
      headerRow.className = 'calendar-row header';
      headerRow.style.gridTemplateColumns = colDef;
      const nameHeader = document.createElement('div');
      nameHeader.className = 'cell name';
      nameHeader.textContent = 'NVR';
      headerRow.appendChild(nameHeader);
      const headerDayCells = [];
      for (let i = 0; i < days.length; i++) {
        const d = days[i];
        const c = document.createElement('div');
        c.className = 'cell day';
        const wk = d.toLocaleDateString(undefined, { weekday: 'short' });
        const dt = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        c.innerHTML = `<div>${wk}</div><div style="font-weight:700;font-size:0.786rem;color:var(--text-secondary);">${dt}</div>`;
        headerRow.appendChild(c);
        headerDayCells.push(c);
      }
      wrapper.appendChild(headerRow);

      // Filter
      const filter = (document.getElementById('nvr-filter').value || '').toLowerCase();
      const filteredNvrs = nvrs.filter(n => {
        const txt = ((n.name || '') + ' ' + (n.ip || '')).toLowerCase();
        return !filter || txt.includes(filter);
      });

      // Stats
      let perfectCount = 0;
      let issueCount = 0;
      let uptimeSum = 0;

      for (const nvr of filteredNvrs) {
        const row = document.createElement('div');
        row.className = 'calendar-row';
        row.style.gridTemplateColumns = colDef;
        const nameCell = document.createElement('div');
        nameCell.className = 'cell name';
        const offline = (events[nvr.ip] || []).filter(x => x.type === 'offline');
        const totalMs = (endOfDay(days[days.length - 1]) - startOfDay(days[0]));
        let totalDownMs = 0;
        for (let j = 0; j < days.length; j++) {
          const d = days[j];
          const dayStart = startOfDay(d);
          const dayEnd = endOfDay(d);
          const { millis } = computeDailyDowntime(dayStart, dayEnd, offline);
          totalDownMs += millis;
        }
        const uptimePct = totalMs > 0 ? Math.max(0, 100 * (1 - (totalDownMs / totalMs))) : 100;
        uptimeSum += uptimePct;
        if (uptimePct >= 99.99) perfectCount++;
        else issueCount++;

        nameCell.innerHTML = `
          <div class="nvr-label">
            <div>
              <div class="nvr-name-text">${nvr.name || ''}</div>
              <div class="nvr-ip-text">${nvr.ip || ''}</div>
            </div>
            <span class="uptime-badge ${uptimeClass(uptimePct)}">${uptimePct.toFixed(1)}%</span>
          </div>
        `;
        row.appendChild(nameCell);

        for (let j = 0; j < days.length; j++) {
          const d = days[j];
          const dayStart = startOfDay(d);
          const dayEnd = endOfDay(d);
          const { millis, ratio } = computeDailyDowntime(dayStart, dayEnd, offline);
          const c = document.createElement('div');
          c.className = 'cell day';
          c.title = `${d.toLocaleDateString()} — downtime ${(millis / 3600000).toFixed(2)}h`;

          c.style.background = colorForRatio(ratio);

          if (millis > 0) {
            const pctDown = (ratio * 100).toFixed(0);
            const hrs = (millis / 3600000);
            let durStr;
            if (hrs < 1) durStr = Math.round(millis / 60000) + 'm';
            else durStr = hrs.toFixed(1) + 'h';
            c.innerHTML = `<div class="day-content"><span class="day-downtime">${pctDown}%</span><span class="day-hours">${durStr}</span></div>`;
          } else {
            c.innerHTML = `<div class="day-content"><span style="color:var(--accent-green);font-size:0.786rem;font-weight:600;">✓</span></div>`;
          }

          c.addEventListener('mouseenter', () => {
            nameCell.classList.add('active');
            headerDayCells[j].classList.add('active');
          });
          c.addEventListener('mouseleave', () => {
            nameCell.classList.remove('active');
            headerDayCells[j].classList.remove('active');
          });
          c.addEventListener('click', () => showDayDetail(nvr, dayStart, dayEnd, offline));
          row.appendChild(c);
        }
        wrapper.appendChild(row);
      }
      container.appendChild(wrapper);

      // Update summary
      document.getElementById('sum-total').textContent = filteredNvrs.length;
      document.getElementById('sum-perfect').textContent = perfectCount;
      document.getElementById('sum-issues').textContent = issueCount;
      const avg = filteredNvrs.length > 0 ? (uptimeSum / filteredNvrs.length).toFixed(1) + '%' : '—';
      document.getElementById('sum-avg').textContent = avg;
    }

    /* ───────── Day Detail Modal ───────── */
    function showDayDetail(nvr, dayStart, dayEnd, offlineIntervals) {
      const overlay = document.createElement('div');
      overlay.className = 'calendar-modal-overlay';
      const modal = document.createElement('div');
      modal.className = 'calendar-modal';

      const h = document.createElement('h3');
      h.textContent = `${nvr.name || ''} — ${nvr.ip || ''}`;
      const dateP = document.createElement('div');
      dateP.className = 'modal-date';
      dateP.textContent = dayStart.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

      const items = [];
      for (const iv of offlineIntervals) {
        const s = new Date(iv.start * 1000);
        const e = new Date((iv.end ?? Math.floor(Date.now() / 1000)) * 1000);
        if (e < dayStart || s > dayEnd) continue;
        const start = new Date(Math.max(s.getTime(), dayStart.getTime()));
        const end = new Date(Math.min(e.getTime(), dayEnd.getTime()));
        const durMs = end - start;
        if (durMs <= 0) continue;
        items.push({ start, end, durMs });
      }
      items.sort((a, b) => a.start - b.start);

      let content;
      if (items.length === 0) {
        content = document.createElement('div');
        content.className = 'no-downtime';
        content.textContent = '✓  No downtime on this day';
      } else {
        const ul = document.createElement('ul');
        ul.className = 'timeline';
        for (const it of items) {
          const li = document.createElement('li');
          const dot = document.createElement('span');
          dot.className = 'dot';
          const timeSpan = document.createElement('span');
          timeSpan.textContent = `${it.start.toLocaleTimeString()} → ${it.end.toLocaleTimeString()}`;
          const dur = document.createElement('span');
          dur.className = 'dur';
          const mins = Math.round(it.durMs / 60000);
          dur.textContent = mins >= 60 ? (it.durMs / 3600000).toFixed(1) + 'h' : mins + 'min';
          li.appendChild(dot);
          li.appendChild(timeSpan);
          li.appendChild(dur);
          ul.appendChild(li);
        }
        content = ul;
      }

      const close = document.createElement('button');
      close.textContent = 'Close';
      close.addEventListener('click', () => { document.body.removeChild(overlay); });
      overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });

      modal.appendChild(h);
      modal.appendChild(dateP);
      modal.appendChild(content);
      modal.appendChild(close);
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
    }

    /* ───────── Init ───────── */
    async function init() {
      const { from, to } = defaultRange();
      setRangeInputs(from, to);
      let nvrs = await loadNvrs();
      let events = await loadEvents(from, to);
      let days = buildDays(from, to);
      renderCalendar(nvrs, events, days);

      // Load button
      document.getElementById('load-range').addEventListener('click', async () => {
        const fromInput = document.getElementById('from-date').value;
        const toInput = document.getElementById('to-date').value;
        if (!fromInput || !toInput) return;
        const from = new Date(fromInput + 'T00:00:00');
        const to = new Date(toInput + 'T23:59:59');
        setRangeInputs(from, to);
        nvrs = await loadNvrs();
        events = await loadEvents(from, to);
        days = buildDays(from, to);
        renderCalendar(nvrs, events, days);
      });

      // Quick presets
      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const daysCount = parseInt(btn.dataset.days, 10);
          const { from, to } = applyPreset(daysCount);
          setRangeInputs(from, to);
          nvrs = await loadNvrs();
          events = await loadEvents(from, to);
          days = buildDays(from, to);
          renderCalendar(nvrs, events, days);
        });
      });

      // Filter
      document.getElementById('nvr-filter').addEventListener('input', () => {
        renderCalendar(nvrs, events, days);
      });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
