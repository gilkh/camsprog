<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NVR Uptime & Downtime heatmap calendar — Cams WebApp" />
  <title>Uptime Calendar — Cams WebApp</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/header.css" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📹</text></svg>" />
  <style>
    /* ═══  Calendar-specific styles  ═══ */

    /* ── Control Panel ── */
    .controls-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr 1.3fr;
      gap: 24px;
      align-items: end;
    }

    .control-group h3 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .range-display {
      background: var(--accent-glow);
      border: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      color: var(--accent-primary-hover);
      font-weight: 600;
      font-size: 0.857rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preset-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preset-btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-medium);
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.857rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .preset-btn:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary-hover);
      background: var(--accent-glow);
    }

    .preset-btn.active {
      background: var(--accent-primary);
      color: white;
      border-color: var(--accent-primary);
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
    }

    .custom-range-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .custom-range-row .field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .custom-range-row .field label {
      font-size: 0.714rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .custom-range-row input[type="date"] {
      padding: 8px 12px;
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.857rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: all var(--transition-fast);
      color-scheme: dark;
    }

    .custom-range-row input[type="date"]:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .arrow-sep {
      color: var(--text-muted);
      font-size: 1.1rem;
      padding-bottom: 8px;
    }

    .btn-load {
      padding: 8px 20px;
      background: linear-gradient(135deg, var(--accent-primary) 0%, #7c3aed 100%);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.857rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
      white-space: nowrap;
    }

    .btn-load:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .legend-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 18px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .legend-text {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* ── Calendar Grid ── */
    .calendar-scroll {
      overflow: auto;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      box-shadow: var(--shadow-md);
    }

    .calendar-wrapper {
      display: inline-block;
      min-width: 100%;
    }

    .calendar-row {
      display: grid;
    }

    .calendar-row.header {
      background: rgba(255, 255, 255, 0.02);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .cell {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      font-size: 0.786rem;
    }

    .cell.name {
      background: var(--bg-card-solid);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: sticky;
      left: 0;
      z-index: 5;
      box-shadow: 1px 0 0 var(--border-subtle);
      color: var(--text-secondary);
      font-weight: 500;
      transition: background var(--transition-fast), color var(--transition-fast);
    }

    .cell.name.active {
      background: rgba(99, 102, 241, 0.08);
      color: var(--text-primary);
    }

    .calendar-row.header .cell {
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.714rem;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      text-align: center;
      background: var(--bg-card-solid);
    }

    .calendar-row.header .cell.name {
      color: var(--text-muted);
    }

    .calendar-row.header .cell.day.active {
      background: rgba(99, 102, 241, 0.08);
      color: var(--accent-primary-hover);
    }

    .cell.day {
      min-width: 110px;
      cursor: pointer;
      color: var(--text-primary);
      white-space: pre-line;
      position: relative;
      text-align: center;
      transition: all var(--transition-fast);
    }

    .cell.day:hover {
      filter: brightness(1.2);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.2) !important;
    }

    .calendar-row:not(.header) .cell.day {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 4px;
    }

    /* ── NVR Name + Uptime ── */
    .nvr-label {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .nvr-label .nvr-name-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
      color: var(--text-primary);
      font-size: 0.786rem;
    }

    .nvr-label .nvr-ip-text {
      font-size: 0.714rem;
      color: var(--text-muted);
      font-family: 'Inter', monospace;
    }

    .uptime-badge {
      display: inline-flex;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 0.679rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-left: auto;
    }

    .uptime-badge.high {
      background: var(--accent-green-soft);
      color: var(--accent-green);
    }

    .uptime-badge.medium {
      background: var(--accent-amber-soft);
      color: var(--accent-amber);
    }

    .uptime-badge.low {
      background: var(--accent-red-soft);
      color: var(--accent-red);
    }

    /* ── Day Cell Content — stacked bar with percentages ── */
    .day-cell-inner {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 52px;
      gap: 6px;
      align-items: stretch;
    }

    .day-bar {
      width: 8px;
      min-width: 8px;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      flex-shrink: 0;
    }

    .bar-seg {
      transition: height 0.3s ease;
    }

    .day-pcts {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
      flex: 1;
      min-width: 0;
    }

    .pct-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.679rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .pct-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .pct-val {
      white-space: nowrap;
    }

    .pct-online { color: #22c55e; }
    .pct-offline { color: #ef4444; }
    .pct-unknown { color: #9ca3af; }

    .dot-online { background: #22c55e; }
    .dot-offline { background: #ef4444; }
    .dot-unknown { background: #9ca3af; }

    /* Future / empty day */
    .day-future {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      opacity: 0.4;
    }

    /* ── Modal ── */
    .calendar-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn var(--transition-medium) ease;
    }

    .calendar-modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-xl);
      padding: 28px;
      width: 90%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
      animation: slideUp var(--transition-slow) ease;
    }

    .calendar-modal h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .calendar-modal .modal-date {
      font-size: 0.857rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .modal-summary {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .modal-summary-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-glass);
      border: 1px solid var(--border-subtle);
      font-size: 0.786rem;
      font-weight: 600;
    }

    .modal-summary-item .ms-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .calendar-modal .timeline {
      margin: 0 0 20px 0;
      padding: 0;
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
    }

    .calendar-modal .timeline li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.857rem;
      color: var(--text-secondary);
    }

    .calendar-modal .timeline li:last-child {
      border-bottom: none;
    }

    .calendar-modal .timeline .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-red);
      flex-shrink: 0;
    }

    .calendar-modal .timeline .dur {
      margin-left: auto;
      font-weight: 600;
      color: var(--accent-amber);
      font-size: 0.786rem;
    }

    .calendar-modal .no-downtime {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px;
      border-radius: var(--radius-sm);
      background: var(--accent-green-soft);
      color: var(--accent-green);
      font-weight: 500;
      font-size: 0.857rem;
    }

    .calendar-modal button {
      background: var(--bg-glass);
      color: var(--text-secondary);
      border: 1px solid var(--border-medium);
      padding: 9px 0;
      border-radius: var(--radius-sm);
      cursor: pointer;
      width: 100%;
      font-family: inherit;
      font-size: 0.857rem;
      font-weight: 500;
      transition: all var(--transition-fast);
    }

    .calendar-modal button:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* ── Summary row ── */
    .summary-strip {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .summary-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-size: 0.857rem;
    }

    .summary-chip .chip-val {
      font-weight: 700;
      color: var(--text-primary);
    }

    .summary-chip .chip-label {
      color: var(--text-muted);
      font-size: 0.786rem;
    }

    /* ── Page title ── */
    .page-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .page-title h2 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin: 0;
    }

    .page-title .subtitle {
      font-size: 0.857rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* ── Responsive ── */
    @media (max-width: 1024px) {
      .controls-card {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    @media (max-width: 640px) {
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .custom-range-row {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body class="page-calendar">
  <header>
    <div class="nav-container">
      <div class="nav-left">
        <a href="/" class="brand">
          <span class="brand-icon">📹</span>
          <h1 class="brand-name" style="margin: 0; display: inline-block;">Cams Control</h1>
        </a>
        <nav class="nav-links">
          <a id="nav-dashboard" class="nav-link" href="/">🖥 Dashboard</a>
          <a id="nav-calendar" class="nav-link" href="/calendar">📅 Calendar</a>
          <a id="nav-logs" class="nav-link" href="/logs">🧾 Logs</a>
          <a id="nav-settings" class="nav-link" href="/settings">⚙ Settings</a>
        </nav>

      <div class="nav-right">

        <!-- Logs actions (visible on body.page-logs) -->

          <div id="logs-live-indicator" class="live-indicator" title="Live status">

      </div>

  </header>

  <main>
    <div class="page-title">
      <h2>📅 Uptime Calendar</h2>
      <span class="subtitle">— NVR uptime & downtime heatmap</span>
    </div>

    <!-- Control Panel -->
    <div class="controls-card">
      <!-- Selected Range -->
      <div class="control-group">
        <h3>📆 Selected Range</h3>
        <div class="range-display">
          <span id="range-text">Loading…</span>
        </div>
      </div>

      <!-- Quick Presets -->
      <div class="control-group">
        <h3>⚡ Quick Presets</h3>
        <div class="preset-bar">
          <button class="preset-btn active" data-days="7">7 Days</button>
          <button class="preset-btn" data-days="14">14 Days</button>

          <button class="preset-btn" data-days="90">90 Days</button>
        </div>

      <!-- Custom Range -->
      <div class="control-group">
        <h3>🎯 Custom Range</h3>
        <div class="custom-range-row">
          <div class="field">
            <label>From</label>
            <input type="date" id="from-date" />
          </div>

          <div class="field">

    <!-- Toolbar -->

      <div class="legend-card">

          <span class="legend-text">Online</span>

        <div class="legend-item">

        <div class="legend-item">

        <span class="chip-label">100 % uptime</span>
      </div>
      <div class="summary-chip">
        <span class="chip-val" id="sum-issues" style="color:var(--accent-amber)">—</span>
        <span class="chip-label">Had downtime</span>
      </div>
      <div class="summary-chip">
        <span class="chip-val" id="sum-avg">—</span>
        <span class="chip-label">Avg uptime</span>
      </div>
    </div>

    <!-- Calendar -->
    <div id="calendar-container" class="calendar-scroll">
      <!-- skeleton -->
      <div style="padding:40px;text-align:center;">
        <div class="skeleton" style="height:20px;width:70%;margin:12px auto;"></div>
        <div class="skeleton" style="height:20px;width:85%;margin:12px auto;"></div>
        <div class="skeleton" style="height:20px;width:60%;margin:12px auto;"></div>
      </div>
    </div>
  </main>

  <script>
    /* ───────── Helpers ───────── */
    function fmtDate(d) {
      return d.toISOString().slice(0, 10);
    }
    function toEpoch(d) {
      return Math.floor(d.getTime() / 1000);
    }
    function startOfDay(d) {
      const x = new Date(d);
      x.setHours(0, 0, 0, 0);
      return x;
    }
    function endOfDay(d) {
      const x = new Date(d);
      x.setHours(23, 59, 59, 999);
      return x;
    }
    function defaultRange() {
      const to = new Date();
      const from = new Date();
      from.setDate(from.getDate() - 6);
      return { from, to };
    }

    function setRangeInputs(from, to) {
      document.getElementById('from-date').value = fmtDate(from);
      document.getElementById('to-date').value = fmtDate(to);
      const rangeText = document.getElementById('range-text');
      const opts = { month: 'short', day: 'numeric', year: 'numeric' };
      rangeText.textContent = `${from.toLocaleDateString(undefined, opts)}  →  ${to.toLocaleDateString(undefined, opts)}`;
    }

    function applyPreset(days) {
      const to = new Date();
      const from = new Date();
      from.setDate(from.getDate() - (days - 1));
      return { from, to };
    }

    async function loadNvrs() {
      const res = await fetch('/api/nvrs');
      return await res.json();
    }

    async function loadEvents(from, to) {
      const q = new URLSearchParams({ from: String(toEpoch(from)), to: String(toEpoch(to)) });
      const res = await fetch(`/api/events?${q.toString()}`);
      return await res.json();
    }

    async function loadCalendarMeta() {
      try {
        const res = await fetch('/api/calendar/meta');
        const data = await res.json();
        return (data && data.status === 'ok' && Number.isFinite(data.baseline_ts)) ? data.baseline_ts : null;
      } catch (e) {
        return null;
      }
    }

    function buildDays(from, to) {
      const days = [];
      const cur = new Date(startOfDay(from));
      const end = endOfDay(to);
      while (cur <= end) {
        days.push(new Date(cur));
        cur.setDate(cur.getDate() + 1);
      }
      return days;
    }

    /**
     * Compute online / offline / unknown milliseconds for a single day.
     *
     * Logic:
     * 1. Start with dayMs = dayEnd - dayStart   (full available time for this day)
     * 2. Sum all offline intervals overlapping this day → offlineMs
     * 3. Sum all unknown intervals overlapping this day → unknownMs
     * 4. If baselineTs is set AND dayStart < baselineTs, mark the portion
     *    before baselineTs as unknown (system wasn't monitoring yet).
     * 5. Ensure offline + unknown never exceeds dayMs.
     * 6. onlineMs = dayMs - offlineMs - unknownMs
     */
    function computeDayStats(dayStart, dayEnd, offlineIntervals, unknownIntervals, baselineTs) {
      const dayMs = dayEnd - dayStart;
      if (dayMs <= 0) return { onlineMs: 0, offlineMs: 0, unknownMs: 0, dayMs: 0 };

      let offlineMs = 0;
      for (const iv of offlineIntervals) {
        const s = new Date(iv.start * 1000);
        const e = new Date((iv.end ?? Math.floor(Date.now() / 1000)) * 1000);
        const overlapStart = Math.max(s.getTime(), dayStart.getTime());
        const overlapEnd = Math.min(e.getTime(), dayEnd.getTime());
        if (overlapEnd > overlapStart) offlineMs += (overlapEnd - overlapStart);
      }

      let unknownMs = 0;
      for (const iv of unknownIntervals) {
        const s = new Date(iv.start * 1000);
        const e = new Date((iv.end ?? Math.floor(Date.now() / 1000)) * 1000);
        const overlapStart = Math.max(s.getTime(), dayStart.getTime());
        const overlapEnd = Math.min(e.getTime(), dayEnd.getTime());
        if (overlapEnd > overlapStart) unknownMs += (overlapEnd - overlapStart);
      }

      // Before baseline = monitoring system wasn't running yet → unknown
      if (baselineTs && Number.isFinite(baselineTs)) {
        const baselineMs = baselineTs * 1000;
        const dayStartMs = dayStart.getTime();
        const dayEndMs = dayEnd.getTime();
        if (baselineMs > dayStartMs) {
          const preMonitorEnd = Math.min(dayEndMs, baselineMs);
          unknownMs += (preMonitorEnd - dayStartMs);
        }
      }

      // Cap: total cannot exceed day
      offlineMs = Math.min(offlineMs, dayMs);
      unknownMs = Math.min(unknownMs, dayMs - offlineMs);
      const onlineMs = Math.max(0, dayMs - offlineMs - unknownMs);

      return { onlineMs, offlineMs, unknownMs, dayMs };
    }

    function uptimeClass(pct) {
      if (pct >= 99.5) return 'high';
      if (pct >= 90) return 'medium';
      return 'low';
    }

    function fmtDuration(ms) {
      const hrs = ms / 3600000;
      if (hrs < 1) return Math.round(ms / 60000) + 'm';
      return hrs.toFixed(1) + 'h';
    }

    /* ───────── Render Calendar ───────── */
    function renderCalendar(nvrs, events, days, baselineTs) {
      const container = document.getElementById('calendar-container');
      container.innerHTML = '';
      const wrapper = document.createElement('div');
      wrapper.className = 'calendar-wrapper';

      const colDef = `240px repeat(${days.length}, 1fr)`;

      // Header row
      const headerRow = document.createElement('div');
      headerRow.className = 'calendar-row header';
      headerRow.style.gridTemplateColumns = colDef;
      const nameHeader = document.createElement('div');
      nameHeader.className = 'cell name';
      nameHeader.textContent = 'NVR';
      headerRow.appendChild(nameHeader);
      const headerDayCells = [];
      for (let i = 0; i < days.length; i++) {
        const d = days[i];
        const c = document.createElement('div');
        c.className = 'cell day';
        const wk = d.toLocaleDateString(undefined, { weekday: 'short' });
        const dt = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        c.innerHTML = `<div>${wk}</div><div style="font-weight:700;font-size:0.786rem;color:var(--text-secondary);">${dt}</div>`;
        headerRow.appendChild(c);
        headerDayCells.push(c);
      }
      wrapper.appendChild(headerRow);

      // Filter
      const filter = (document.getElementById('nvr-filter').value || '').toLowerCase();
      const filteredNvrs = nvrs.filter(n => {
        const txt = ((n.name || '') + ' ' + (n.ip || '')).toLowerCase();
        return !filter || txt.includes(filter);
      });

      // Stats
      let perfectCount = 0;
      let issueCount = 0;
      let uptimeSum = 0;

      const now = new Date();

      for (const nvr of filteredNvrs) {
        const row = document.createElement('div');
        row.className = 'calendar-row';
        row.style.gridTemplateColumns = colDef;
        const nameCell = document.createElement('div');
        nameCell.className = 'cell name';

        const eventsForIp = events[nvr.ip] || [];
        const offline = eventsForIp.filter(x => x.type === 'offline');
        const unknown = eventsForIp.filter(x => x.type === 'unknown');

        let totalMs = 0;
        let totalOnlineMs = 0;
        let totalOfflineMs = 0;
        let totalUnknownMs = 0;

        for (let j = 0; j < days.length; j++) {
          const d = days[j];
          const dayStart = startOfDay(d);
          if (dayStart > now) continue;

          const isToday = dayStart.toDateString() === now.toDateString();
          const dayEnd = isToday ? now : endOfDay(d);

          const stats = computeDayStats(dayStart, dayEnd, offline, unknown, baselineTs);
          totalMs += stats.dayMs;
          totalOnlineMs += stats.onlineMs;
          totalOfflineMs += stats.offlineMs;
          totalUnknownMs += stats.unknownMs;
        }

        // Uptime % is computed over KNOWN time (exclude unknown from denominator)
        const knownMs = totalOnlineMs + totalOfflineMs;
        const uptimePct = knownMs > 0 ? (totalOnlineMs / knownMs) * 100 : 100;
        uptimeSum += uptimePct;
        if (uptimePct >= 99.99) perfectCount++;
        else issueCount++;

        nameCell.innerHTML = `
          <div class="nvr-label">
            <div>
              <div class="nvr-name-text">${nvr.name || ''}</div>
              <div class="nvr-ip-text">${nvr.ip || ''}</div>
            </div>
            <span class="uptime-badge ${uptimeClass(uptimePct)}">${uptimePct.toFixed(1)}%</span>
          </div>
        `;
        row.appendChild(nameCell);

        for (let j = 0; j < days.length; j++) {
          const d = days[j];
          const dayStart = startOfDay(d);

          // Future days are empty
          if (dayStart > now) {
            const c = document.createElement('div');
            c.className = 'cell day';
            c.innerHTML = '<div class="day-future">—</div>';
            row.appendChild(c);
            continue;
          }

          const isToday = dayStart.toDateString() === now.toDateString();
          const dayEnd = isToday ? now : endOfDay(d);

          const stats = computeDayStats(dayStart, dayEnd, offline, unknown, baselineTs);

          const onlinePct = stats.dayMs > 0 ? (stats.onlineMs / stats.dayMs) * 100 : 0;
          const offlinePct = stats.dayMs > 0 ? (stats.offlineMs / stats.dayMs) * 100 : 0;
          const unknownPct = stats.dayMs > 0 ? (stats.unknownMs / stats.dayMs) * 100 : 0;

          const c = document.createElement('div');
          c.className = 'cell day';

          // Background tint based on dominant status
          let bgColor;
          if (unknownPct > 95) {
            bgColor = 'rgba(156,163,175,0.12)';
          } else if (onlinePct >= 99) {
            bgColor = 'rgba(34,197,94,0.08)';
          } else if (offlinePct > 50) {
            bgColor = 'rgba(239,68,68,0.10)';
          } else if (offlinePct > 0) {
            bgColor = 'rgba(234,179,8,0.08)';
          } else {
            bgColor = 'rgba(34,197,94,0.08)';
          }
          c.style.background = bgColor;

          c.title = `${d.toLocaleDateString()}\nOnline: ${onlinePct.toFixed(1)}%\nOffline: ${offlinePct.toFixed(1)}%\nUnknown: ${unknownPct.toFixed(1)}%`;

          // Build cell content: stacked bar + percentages
          const inner = document.createElement('div');
          inner.className = 'day-cell-inner';

          // Stacked vertical bar
          const bar = document.createElement('div');
          bar.className = 'day-bar';
          const segOnline = document.createElement('div');
          segOnline.className = 'bar-seg';
          segOnline.style.height = onlinePct + '%';
          segOnline.style.background = '#22c55e';
          const segOffline = document.createElement('div');
          segOffline.className = 'bar-seg';
          segOffline.style.height = offlinePct + '%';
          segOffline.style.background = '#ef4444';
          const segUnknown = document.createElement('div');
          segUnknown.className = 'bar-seg';
          segUnknown.style.height = unknownPct + '%';
          segUnknown.style.background = '#9ca3af';
          bar.appendChild(segOnline);
          bar.appendChild(segOffline);
          bar.appendChild(segUnknown);
          inner.appendChild(bar);

          // Percentages text
          const pcts = document.createElement('div');
          pcts.className = 'day-pcts';

          // Always show online
          const rowOn = document.createElement('div');
          rowOn.className = 'pct-row';
          rowOn.innerHTML = `<span class="pct-dot dot-online"></span><span class="pct-val pct-online">${Math.round(onlinePct)}%</span>`;
          pcts.appendChild(rowOn);

          // Show offline if > 0
          if (offlinePct > 0.05) {
            const rowOff = document.createElement('div');
            rowOff.className = 'pct-row';
            rowOff.innerHTML = `<span class="pct-dot dot-offline"></span><span class="pct-val pct-offline">${Math.round(offlinePct)}%</span>`;
            pcts.appendChild(rowOff);
          }

          // Show unknown if > 0
          if (unknownPct > 0.05) {
            const rowUnk = document.createElement('div');
            rowUnk.className = 'pct-row';
            rowUnk.innerHTML = `<span class="pct-dot dot-unknown"></span><span class="pct-val pct-unknown">${Math.round(unknownPct)}%</span>`;
            pcts.appendChild(rowUnk);
          }

          inner.appendChild(pcts);
          c.appendChild(inner);

          c.addEventListener('mouseenter', () => {
            nameCell.classList.add('active');
            headerDayCells[j].classList.add('active');
          });
          c.addEventListener('mouseleave', () => {
            nameCell.classList.remove('active');
            headerDayCells[j].classList.remove('active');
          });
          c.addEventListener('click', () => showDayDetail(nvr, dayStart, dayEnd, offline, unknown, stats));
          row.appendChild(c);
        }
        wrapper.appendChild(row);
      }
      container.appendChild(wrapper);

      // Update summary
      document.getElementById('sum-total').textContent = filteredNvrs.length;
      document.getElementById('sum-perfect').textContent = perfectCount;
      document.getElementById('sum-issues').textContent = issueCount;
      const avg = filteredNvrs.length > 0 ? (uptimeSum / filteredNvrs.length).toFixed(1) + '%' : '—';
      document.getElementById('sum-avg').textContent = avg;
    }

    /* ───────── Day Detail Modal ───────── */
    function showDayDetail(nvr, dayStart, dayEnd, offlineIntervals, unknownIntervals, stats) {
      const overlay = document.createElement('div');
      overlay.className = 'calendar-modal-overlay';
      const modal = document.createElement('div');
      modal.className = 'calendar-modal';

      const h = document.createElement('h3');
      h.textContent = `${nvr.name || ''} — ${nvr.ip || ''}`;
      const dateP = document.createElement('div');
      dateP.className = 'modal-date';
      dateP.textContent = dayStart.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

      // Summary bar
      const summaryDiv = document.createElement('div');
      summaryDiv.className = 'modal-summary';

      const onlinePct = stats.dayMs > 0 ? (stats.onlineMs / stats.dayMs) * 100 : 0;
      const offlinePct = stats.dayMs > 0 ? (stats.offlineMs / stats.dayMs) * 100 : 0;
      const unknownPct = stats.dayMs > 0 ? (stats.unknownMs / stats.dayMs) * 100 : 0;

      summaryDiv.innerHTML = `
        <div class="modal-summary-item">
          <span class="ms-dot dot-online"></span>
          <span style="color:#22c55e">${onlinePct.toFixed(1)}% Online</span>
          <span style="color:var(--text-muted);font-size:0.714rem;">(${fmtDuration(stats.onlineMs)})</span>
        </div>
        <div class="modal-summary-item">
          <span class="ms-dot dot-offline"></span>
          <span style="color:#ef4444">${offlinePct.toFixed(1)}% Offline</span>
          <span style="color:var(--text-muted);font-size:0.714rem;">(${fmtDuration(stats.offlineMs)})</span>
        </div>
        <div class="modal-summary-item">
          <span class="ms-dot dot-unknown"></span>
          <span style="color:#9ca3af">${unknownPct.toFixed(1)}% Unknown</span>
          <span style="color:var(--text-muted);font-size:0.714rem;">(${fmtDuration(stats.unknownMs)})</span>
        </div>
      `;

      const items = [];
      const addIntervals = (intervals, type) => {
        for (const iv of intervals) {
          const s = new Date(iv.start * 1000);
          const e = new Date((iv.end ?? Math.floor(Date.now() / 1000)) * 1000);
          if (e < dayStart || s > dayEnd) continue;
          const start = new Date(Math.max(s.getTime(), dayStart.getTime()));
          const end = new Date(Math.min(e.getTime(), dayEnd.getTime()));
          const durMs = end - start;
          if (durMs <= 0) continue;
          items.push({ start, end, durMs, type });
        }
      };

      addIntervals(offlineIntervals, 'offline');
      addIntervals(unknownIntervals, 'unknown');

      items.sort((a, b) => a.start - b.start);

      let content;
      if (items.length === 0) {
        content = document.createElement('div');
        content.className = 'no-downtime';
        content.textContent = '✓  No downtime or unknown periods recorded on this day';
      } else {
        const ul = document.createElement('ul');
        ul.className = 'timeline';
        for (const it of items) {
          const li = document.createElement('li');
          const dot = document.createElement('span');
          dot.className = 'dot';
          if (it.type === 'unknown') {
            dot.style.background = '#9ca3af';
          }
          const timeSpan = document.createElement('span');
          timeSpan.textContent = `${it.start.toLocaleTimeString()} → ${it.end.toLocaleTimeString()}`;
          if (it.type === 'unknown') {
            timeSpan.textContent += ' (System Off)';
            timeSpan.style.color = '#9ca3af';
          } else {
            timeSpan.textContent += ' (NVR Offline)';
          }
          const dur = document.createElement('span');
          dur.className = 'dur';
          dur.textContent = fmtDuration(it.durMs);
          li.appendChild(dot);
          li.appendChild(timeSpan);
          li.appendChild(dur);
          ul.appendChild(li);
        }
        content = ul;
      }

      const close = document.createElement('button');
      close.textContent = 'Close';
      close.addEventListener('click', () => { document.body.removeChild(overlay); });
      overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });

      modal.appendChild(h);
      modal.appendChild(dateP);
      modal.appendChild(summaryDiv);
      modal.appendChild(content);
      modal.appendChild(close);
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
    }

    /* ───────── Init ───────── */
    async function init() {
      const { from, to } = defaultRange();
      setRangeInputs(from, to);
      let nvrs = await loadNvrs();
      let events = await loadEvents(from, to);
      let baselineTs = await loadCalendarMeta();
      let days = buildDays(from, to);
      renderCalendar(nvrs, events, days, baselineTs);

      // Load button
      document.getElementById('load-range').addEventListener('click', async () => {
        const fromInput = document.getElementById('from-date').value;
        const toInput = document.getElementById('to-date').value;
        if (!fromInput || !toInput) return;
        const from = new Date(fromInput + 'T00:00:00');
        const to = new Date(toInput + 'T23:59:59');
        setRangeInputs(from, to);
        nvrs = await loadNvrs();
        events = await loadEvents(from, to);
        baselineTs = await loadCalendarMeta();
        days = buildDays(from, to);
        renderCalendar(nvrs, events, days, baselineTs);
      });

      // Quick presets
      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const daysCount = parseInt(btn.dataset.days, 10);
          const { from, to } = applyPreset(daysCount);
          setRangeInputs(from, to);
          nvrs = await loadNvrs();
          events = await loadEvents(from, to);
          baselineTs = await loadCalendarMeta();
          days = buildDays(from, to);
          renderCalendar(nvrs, events, days, baselineTs);
        });
      });

      // Filter
      document.getElementById('nvr-filter').addEventListener('input', () => {
        renderCalendar(nvrs, events, days, baselineTs);
      });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
